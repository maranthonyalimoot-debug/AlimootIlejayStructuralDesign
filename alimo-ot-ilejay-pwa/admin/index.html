<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — Alimo-ot Ilejay Structural Design</title>
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="/assets/icons/icon-192.png">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>

<header class="admin-header">
  <div class="wrap">
    <a href="/" class="admin-back">&larr; Site</a>
    <div class="admin-title">Alimo-ot Ilejay <span>Admin</span></div>
    <button id="logoutBtn" class="btn btn-outline btn-sm" hidden>Log out</button>
  </div>
</header>

<div class="banner" id="banner" hidden>
  Signed in — leads and tasks are shared live between Mar Anthony and Samantha.
</div>

<main id="dashboardMain" hidden>
  <div class="toolbar">
    <div class="tabs" id="tabs" hidden>
      <button class="tab-btn" data-tab="inquiries">Inquiries</button>
      <button class="tab-btn active" data-tab="leads">Leads</button>
      <button class="tab-btn" data-tab="projects">Projects</button>
      <button class="tab-btn" data-tab="tasks">Tasks</button>
    </div>
    <button id="addBtn" class="btn btn-primary btn-sm">+ Add lead</button>
  </div>

  <div class="filter-row">
    <select id="filterSelect" aria-label="Filter by assignee">
      <option value="all">Everyone</option>
      <option value="Mar Anthony">Mar Anthony</option>
      <option value="Samantha">Samantha</option>
    </select>
  </div>

  <div id="taskSummary" class="task-summary" hidden></div>

  <div id="board" class="board"></div>
  <div id="projectsView" class="projects-view" hidden></div>
</main>

<div id="loginOverlay" class="modal-overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <h2 id="loginTitle">Admin sign-in</h2>
    <form id="loginForm">
      <label>Email<input type="email" name="email" required autocomplete="username"></label>
      <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
      <p id="loginError" class="login-error" hidden></p>
      <div class="modal-actions">
        <span></span>
        <div class="modal-actions-right">
          <button type="submit" class="btn btn-primary btn-sm">Sign in</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div id="modalOverlay" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Add lead</h2>
    <form id="modalForm">
      <div id="modalFields"></div>
      <div class="modal-actions">
        <button type="button" id="modalDeleteBtn" class="btn btn-outline btn-sm" hidden>Delete</button>
        <div class="modal-actions-right">
          <button type="button" id="modalConvertBtn" class="btn btn-outline btn-sm" hidden>Convert to Lead</button>
          <button type="button" id="modalCancelBtn" class="btn btn-outline btn-sm">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Save</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/admin/js/supabaseClient.js"></script>
<script src="/admin/js/store.js"></script>
<script src="/admin/js/admin.js"></script>
</body>
</html>
