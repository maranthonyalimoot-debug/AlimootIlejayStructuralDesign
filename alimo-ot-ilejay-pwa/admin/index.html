<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — Alimo-ot Ilejay Structural Design</title>
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="../assets/icons/icon-192.png">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<header class="admin-header">
  <div class="wrap">
    <a href="../" class="admin-back">&larr; Site</a>
    <div class="admin-title">Alimo-ot Ilejay <span>Admin</span></div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="leads">Leads</button>
      <button class="tab-btn" data-tab="tasks">Tasks</button>
    </div>
  </div>
</header>

<div class="banner">
  Placeholder mode — data below is stored only in this browser and isn't synced between Mar Anthony and Samantha yet. Real shared storage is planned (Supabase).
</div>

<main>
  <div class="toolbar">
    <select id="filterSelect" aria-label="Filter by assignee">
      <option value="all">Everyone</option>
      <option value="Mar Anthony">Mar Anthony</option>
      <option value="Samantha">Samantha</option>
    </select>
    <button id="addBtn" class="btn btn-primary btn-sm">+ Add lead</button>
  </div>

  <div id="board" class="board"></div>
</main>

<div id="modalOverlay" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Add lead</h2>
    <form id="modalForm">
      <div id="modalFields"></div>
      <div class="modal-actions">
        <button type="button" id="modalDeleteBtn" class="btn btn-outline btn-sm" hidden>Delete</button>
        <div class="modal-actions-right">
          <button type="button" id="modalCancelBtn" class="btn btn-outline btn-sm">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Save</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
